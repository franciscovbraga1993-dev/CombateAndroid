name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          unzip -q CombateAndroid_Projeto.zip
          cd CombateAndroid
          chmod +x gradlew 2>/dev/null || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: CombateAndroid
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Combate-APK
          path: CombateAndroid/app/build/outputs/apk/debug/app-debug.apk
